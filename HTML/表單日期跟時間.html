<!DOCTYPE html>
<html lang="en">
<head>
    <title>html表單 日期跟數字</title>
</head>
<body>
    <h1>台灣旅遊</h1>
    <form action="">
       <label for="">出發的日期</label>
       <input type="date" name="date" id="date" >
       <br>
       <label for="">停留的天數</label>
       <input type="number" name="number" id="number" min="1" max="10" >
       <br>
       <input type="submit" value="提交" >
    </form>
</body>
</html>
