<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        table{
            border:2px solid blue;
            border-collapse: collapse;
        }
        thead{
            background-color: rgb(59, 143, 195);
        }
        tbody{
            background-color: #d9d4d2ca;
        }
        th,td{
            border:2px solid green;
            padding:5px;
        }
        thead,tfoot{
            background-color: rgb(59, 143, 195);
            text-align: center;
        }
    </style>
</head>
<body>
    <table>
        <thead>
            <tr>
                <th>國家</th>
                <th>首都</th>
                <th>國花</th>
            </tr>
        <tbody>
            <tr>
                <td>芬蘭</td>
                <td>赫爾辛基</td>
                <td>鈴蘭</td>
            </tr>
            <tr>
                <td>德國</td>
                <td>柏林</td>
                <td>車菊</td>
            </tr>
            <tr>
                <td>荷蘭</td>
                <td>阿姆斯特丹</td>
                <td>鬱金香</td>
            </tr>
            <tr>
                <td>波蘭</td>
                <td>華沙</td>
                <td>三色堇</td>
            </tr>
            <tr>
                <td>奧地利</td>
                <td>維也納</td>

            </tr>
            <tr>
                <td>義大利</td>

                <td>雛菊</td>
            </tr>
            <tr>
                <td>希臘</td>

                <td>油橄蘭</td>
            </tr>
            <tr>
                <td>西班牙</td>
                <td>馬德里</td>
                <td>香石竹</td>
            </tr>
            <tr>
                <td>法國</td>
                <td>巴黎</td>
                <td>箱根</td>
            </tr>
            <tr>
                <td>英國</td>
                <td>倫敦</td>
                <td>玫瑰</td>
            </tr>
        <tfoot>
            <tr>
                <td colspan="3">王顥勳</td>
            </tr>
        </tfoot>
        </tbody>
        </thead>
    </table>

</html>
