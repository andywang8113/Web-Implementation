<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            display: flex;             /* 使用 flexbox */
            flex-direction: column;    /* 垂直排列 */
            align-items: center;       /* 水平居中 */
            justify-content: center;    /* 垂直居中 */
            height: 100vh;            /* 使 body 高度為視口高度 */
            margin: 0;                /* 清除預設的 margin */
        }
        figure {
            text-align: center;        /* 讓 figure 內的文字居中 */
        }
    </style>
</head>
<body>
    <figure>
        <img src="./image/article-598d1b33a34a9.jpg" width="400" alt="飛機圖像">
        <figcaption>
            取材來自長榮航空
        </figcaption>
    </figure>
</body>
</html>
