<!DOCTYPE html>
<html lang="en">
  <head>
      <title>CSS Transform</title>
      <style>
         #box1{
          transform: scale(0.5);
          border: 5px solid blue;
          width:100px;
          height:100px;
          font-size:1em;
          text-align: center;
          background-color:orange;
         }
      </style>
  </head>
  <body>
     <div id="box1">
      <h1>嗨</h1>
     </div>
  </body>
  </html>
