<!DOCTYPE html>
<html lang="en">
<head>
    <title>CSS Display屬性</title>
    <style>
        div{
            height: 200px;
            display:inline-block;
        }
        span{
            display:inline-block;
        }
        p{
            display:none;
        }
    </style>
</head>
<body>
    <div>我是div (block區塊)</div>
    <span>我是span1(inline行內)</span>
    <span>我是span2</span>
    <span>我是span3</span>
    <span>我是span4</span>
    <span>我是span5</span>
    <p>Lorem ipsum dolor sit, amet consectetur adipisicing elit. Voluptatem rem expedita ad ducimus, neque inventore nulla molestias alias nam, atque unde necessitatibus, tempore voluptatibus ea quos possimus! Quae, ut modi.</p>
</body>
</html>
