<!DOCTYPE html>
<html lang="en">
<head>
    <title>CSS邊框</title>
    <style>
        li{
            display: inline-block;
            list-style: none;
            width: 100px;
            background-color: yellow;
            text-align: center;
        }
        li a{
            text-decoration-line: none;
            color: blue;
        }
    </style>
</head>
<body>
    <ul>
        <li><a href="#">產品型錄</a></li>
        <li><a href="#">銷售門市</a></li>
        <li><a href="#">關於我們</a></li>
    </ul>
</body>
</html>
