    <style>
        *{
            margin: 0;
            padding: 0;
        }
        body{
            width:100%;

        }
        header, nav, main, footer{

        header{

            margin: 50px 0 20px;
        }
        .gridcontainer{
            display: grid;
            gap: 20px;
            grid-template-columns: 1fr;
        }
        .img-photo {
            width: 100%; /* 使圖片佔滿容器 */
            height: 200px; /* 固定高度 */
            object-fit: cover; /* 確保圖片不變形並填滿容器 */
            border-radius: 5px; /* 可選圓角 */
}

        }

        .a-back{

            color: rgb(27, 24, 173);

            margin: 10px;
        }
        @media screen and (min-width: 769px){
            .gridcontainer{
                grid-template-columns: 1fr 1fr 1fr;
            }
        }
