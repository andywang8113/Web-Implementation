<!DOCTYPE html>
<html lang="en">
<head>
    <title>CSS中的高度和寬度</title>
    <style>
        *{
            box-sizing: border-box;
        }
        .container{
            background-color: aqua;
            height: 100vh;
        }
        .box{
            min-width: 25%;
            max-width: 50%;
            height: 100px;
            border:2px solid red;
            float:left;
        }
    </style>
</head>
<body>
    <div class="container">
    <div class="box">
        我是第一個box
    </div>
    <div class="box">
        我是第二個box
    </div>
    <div class="box">
        我是第三個box
    </div>
    <div class="box">
        我是第四個box
    </div>
</div>
    </body>
</html>
