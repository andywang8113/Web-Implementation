<!DOCTYPE html>
<html lang="en">
<head>
    <title>CSS邊框</title>
    <style>
        #img1{
            vertical-align: top;
        }
        #img2{
            vertical-align: bottom;
        }
        #img3{
            vertical-align: middle;
        }
        #img4{
            vertical-align: 30px;
        }
    </style>
</head>
<body>

   <p>地<img id="img2" src="./image/3 - 複製.jpg" width="100px">球</p>
   <p>地<img id="img3" src="./image/3 - 複製.jpg" width="100px">球</p>
   <p>地<img id="img4" src="./image/3 - 複製.jpg" width="100px">球</p>
</body>
</html>
