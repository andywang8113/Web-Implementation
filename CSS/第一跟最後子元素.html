<!DOCTYPE html>
<html lang="en">
<head>
    <title>CSS第一子元素和最後子元素</title>
    <style>
        article p:first-child{
            color:goldenrod;
        }
        article p:last-child{
            color:blueviolet;
        }
    </style>
</head>
<body>
 <article>
    <p>這是第一段文字</p>
    <p>這是第二段文字</p>
    <p>這是第三段文字</p>
    <p>這是最後一段文字。想了解更多<a href="#">點擊這裡</a></p>
 </article>
 <article>
    <p>這是另篇文章的第一段文字</p>
    <p>這是另篇文章的第二段文字</p>
    <p>這是另篇文章的第三段文字</p>
    <p>這是另篇文章的最後一段文字。想了解更多<a href="#">點擊這裡</a></p>
 </article>
</body>
</html>
