<!DOCTYPE html>
<html lang="en">
<head>
    <title>CSS padding內邊距</title>
    <style>
        .myDiv{
            margin: 30px;
            border:3px solid greenyellow;
            padding-top: 10px;
            padding-bottom: 30px;
            padding-left: 15px;
            padding-right: 15px;
            /*padding:10px 15px 30px 15px*/ /*可以寫成一行,方向的部分從左到右是"上右下左 
                          /*padding: 15px;*/ /*如果上右下左的值都一樣只要輸入一個*/                                              
        }
    </style>
</head>
<body>
     <div class="myDiv">
     我是一個div元素,我具有邊距跟內邊距還有邊框
     </div>
</body>
</html>
