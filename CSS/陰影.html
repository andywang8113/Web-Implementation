<!DOCTYPE html>
<html lang="en">
<head>
    <title>CSS中的陰影</title>
    <style>
        h1{
            text-shadow: 1px 10px 10px blue;
        }
        #box_1{
            box-shadow: 1px 10px 10px green;
        }
        #box_2{
            box-shadow: 1px 10px 10px yellow;
        }
    </style>
</head>
<body>
    <h1>andy wang</h1>
    <div id="box_1">
        我是第一個盒子
    </div>
    <div id="box_2">
        我是第二個盒子
    </div>
</body>
</html>
