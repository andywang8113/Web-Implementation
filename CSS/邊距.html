<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS的邊距 Margin</title>
    <style>
        h1{
            margin-top: 50px;
        }
        div{
            width: 150px;
            height: 150px;
            border: 2px solid blue;
        }
        #box_1{
            margin-bottom: 50px;
            margin-top: 50px;
            margin-left: 50px;
            margin-right: 50px;
        }
        #box_2{
            margin-bottom: 50px;
            margin-top: 50px;
            margin-left: 50px;
            margin-right: 50px;
        }
    </style>
</head>
<body>
    <h1>我是標題元素</h1>
    <div id="box_1">
        我是第一個box
    </div>
    <div id="box_2">
        我是第二個box
    </div>
</body>
</html>
