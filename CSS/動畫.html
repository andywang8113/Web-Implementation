<!DOCTYPE html>
<html lang="en">
  <head>
      <title>CSS 動畫</title>
      <style>
         #box1{
          border: 5px solid blue;
          width:100px;
          height:100px;
          font-size:1em;
          text-align: center;
          background-color:orange;
          animation-name: slide-left;
          animation-duration: 10s;
         }
         @keyframes slide-left{
          from{
            transform: rotate(0deg);
          }
          to{
            transform: rotate(360deg);
          }
         }
      </style>
  </head>
  <body>
     <div id="box1">
      <h1>嗨</h1>
     </div>
  </body>
  </html>
