<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
  .colorSquare{
  height: 150px;
  width: 150px;
}
#red{
   background-color: red;
}
#yellow{
  background-color: yellow;
}
#green{
  background-color: green;
}

  </style>
</head>
<body>
  <h1>DOM 元素操作練習 - 黃綠紅你要哪一個？</h1>
  <button id="changeButton">切換標題</button>
  <div id='title'>
    <h2>標題</h2>
  </div>
  <h2>黃綠紅你要哪一個？點擊以下方塊</h2>
  <div style="display: flex">
    <button class='colorSquare' id='red' value='red'></button>
    <button class='colorSquare' id='yellow' value='yellow'></button>
    <button class='colorSquare' id='green' value='green'></button>
  </div>
  <h2>輸出</h2>
  <div id="output">
  </div>
  <script>
// function changeTitle(){
    let titleDiv = document.getElementById('title')
    console.log("title:",titleDiv)
    let message = '報告王顥勳,標題以切換!'
    titleDiv.innerText = message
    titleDiv.style.color = 'blue'
// }
    const squares = document.querySelectorAll('.colorSquare')
    const output = document.getElementById('output')
// 將每個元素綁定
    squares.forEach(square => {
    square.onclick = () => {
    _id = square.getAttribute('id')
    output.innerHTML = `<div class='colorSquare' id="${_id}"></div>`
  }
})
function resetScore() {
}
const resetGameBtn = document.getElementById('reset')
// 綁定 reset 事件
resetGameBtn.onclick = () => resetScore()
  </script>
</body>
</html>
