<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Java script賦值運算子</title>
    <!-- <link rel="stylesheet" href="style.css"> -->
</head>
<body>
    <h1>第一種迴圈for(1),用for迴圈到著數綿羊,直到睡著</h1>
    <script>
        //初始條件 , 終止條件 , 每次的執行
       for(let i = 1; i <= 10; i++){
        if(i === 4){
            continue
        }
        console.log("第" + i + "隻綿羊");
       }
    </script>
    <!-- <script src="./script.js"></script> -->
</body>
</html>
