<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Java script賦值運算子</title>
    <!-- <link rel="stylesheet" href="style.css"> -->
</head>
<body>
    <h1>if 與 else,如果你歐趴,就帶你去歐洲玩</h1>
    <script>
        var key = '被21';  //可改數值
        switch (key) {
            case '歐趴':
            console.log('帶你去歐洲玩')
                break;
            case '只被當一顆':
            console.log('帶你去台北玩')
                break;
            default:
            console.log('留在這重補修')
                break;
        }
    </script>
    <!-- <script src="./script.js"></script> -->
</body>
</html>
