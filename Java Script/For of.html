<body>
  <h1>for of 與 for in 跟 iterator</h1>
  <script>
      var myString = 'hello';
      
      var myArrary = [1,2,3,4,5,6,7];
      
      for(let str of myString){
        console.log(str)
      }
      for(let element of myArrary){
        console.log(element)
      }
 </script>
