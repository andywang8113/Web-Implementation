<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Java script賦值運算子</title>
    <!-- <link rel="stylesheet" href="style.css"> -->
</head>
<body>
    <h1>第一種迴圈for(1),用for迴圈到著數綿羊,直到睡著</h1>
    <script>
        //初始條件 , 終止條件 , 每次的執行
       for(var x = 1; x <=100; x++){
           console.log("第" + x + "隻綿羊");
           if(x === 31){
             console.log("睡著了!")
             break;
           }
       }
    </script>
    <!-- <script src="./script.js"></script> -->
</body>
</html>
