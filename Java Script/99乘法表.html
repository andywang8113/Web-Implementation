<body>
    <h1>99乘法表,雙層迴圈</h1>
    <script>
        for(let i = 1; i < 10; i++){
            for(let j =1; j < 10; j++){
                let result = i * j; 
                let str = i + "x" + j +"=" + result;
                console.log(str)
            }
        }
    </script>

</body>
