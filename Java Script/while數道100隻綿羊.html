<body>
    <h1>第一種迴圈for(1),用for迴圈到著數綿羊,直到睡著</h1>
    <script>
       let x = 0;
       while(x < 100){
       x++; // x+1
       if(x === 5){
        continue
       }
       console.log("第" + x + "隻綿羊");
       }
    </script>

</body>
