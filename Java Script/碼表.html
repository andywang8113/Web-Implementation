<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>碼錶</title>
    <style>
body {
  background: #5dc77b;
  font-family: 'HelveticaNeue-Light', 'Helvetica Neue Light', 'Helvetica Neue',
    Helvetica, Arial, 'Lucida Grande', sans-serif;
  height: 100%;
}
.wrapper {
  width: 800px;
  margin: 30px auto;
  color: white;
  text-align: center;
}
h1,h2,h3 {
  font-family: 'Roboto', sans-serif;
  font-weight: 100;
  font-size: 2.6em;
  text-transform: uppercase;
}
#seconds,#m_seconds {
  font-size: 2em;
}
button {
  border-radius: 5px;
  background: #416bcb;
  color: white;
  border: solid 1px white;
  text-decoration: none;
  cursor: pointer;
  font-size: 1.2em;
  padding: 18px 10px;
  width: 180px;
  margin: 10px;
  outline: none;
}
button:hover { 
  transition: all 0.3s ease;
  background: white;
  border: solid 1px white;
  color: #ffa600;
}
</style>
  </head>
  <body>
    <div class="wrapper">
      <h1>JS 碼錶</h1>
      <p><span id="seconds">00</span>:<span id="m_seconds">00</span></p>
      <button id="button-start">Start</button><br>
      <button id="button-stop">Stop</button><br>
      <button id="button-reset">Reset</button>
<script>
      let seconds = 0
      let m_seconds = 0
      const displayMSeconds = document.getElementById('m_seconds')
      const displaySeconds = document.getElementById('seconds')
      const buttonStart = document.getElementById('button-start')
      const buttonStop = document.getElementById('button-stop')
      const buttonReset = document.getElementById('button-reset')
      let interval
// 綁定 buttonStart 按鈕的觸發事件
buttonStart.onclick = () => {
      clearInterval(interval)
      interval = setInterval(timer, 10)
}
// 綁定 buttonStop 按鈕的觸發事件
buttonStop.onclick = () => {
      clearInterval(interval)
}
// 綁定 buttonReset 按鈕的觸發事件
buttonReset.onclick = () => {
      clearInterval(interval)
      m_seconds = 0
      seconds = 0
      displayMSeconds.innerHTML = `0${m_seconds}`
      displaySeconds.innerHTML = `0${seconds}`
}
// 碼錶讀取方法
const timer = () => {
      m_seconds++
  if (Number(m_seconds) <= 9) {
    displayMSeconds.innerHTML = `0${m_seconds}`
  }
  if (Number(m_seconds) > 9) {
    displayMSeconds.innerHTML = m_seconds
  }
  if (Number(m_seconds) > 99) {
    console.log('seconds')
    seconds++
    displaySeconds.innerHTML = `0${seconds}`
    m_seconds = 0
    displayMSeconds.innerHTML = `0${m_seconds}`
  }
  if (Number(seconds) > 9) {
    displaySeconds.innerHTML = seconds
  }
}
       </script>
    </div>
  </body>
</html>
