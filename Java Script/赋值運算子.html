<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Java script賦值運算子</title>
    <!-- <link rel="stylesheet" href="style.css"> -->
</head>
<body>
    <h1>賦值運算子</h1>
    <script>
        console.log('賦值運算子');
        var x = 1;
        console.log('x:',x)
        x += 1;
        console.log('x += 1 等於', x);
        // x = x + 1
        var y = 10;
        y -= 2
        //y = y - 2
        console.log('y -= 2 等於', y);
        x *= 5;
        //x = x * 5
        console.log('x *= 5 等於', x);
        x /= 2;
        //x = x / 2
        console.log('x /= 2 等於', x);
        var z = 35;
        z %= 6;
        //z = z % 6
        console.log('z %= 6 等於', z);
        var a = 2;
        a **= 5;
                //a = a=2的5次方
                 console.log('a **= 5 等於', a);
        var b;
        b ||= 10;
        console.log('給預設值 等於', b);
        var c = 200;
        c ||= 10;
        console.log('給預設值 等於', c);
    </script>
    <!-- <script src="./script.js"></script> -->
</body>
</html>
