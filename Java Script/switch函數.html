     <script>
        var number = prompt("輸入1~5數字","");
        switch(number){
            case "1":
                alert("ONE")
                break;
            case "2":
                alert("TWO")
                break;
            case "3":
                alert("THREE")
                break;
            case "4":
                alert("FOUR")
                break;
            case "5":
                alert("FIVE")
                break;
            default:
                alert("超過範圍!")
                break;
        }
     </script>
