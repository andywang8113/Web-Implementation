<!-- pop元素
arr.pop()會把最後一個元素丟出來,最後的元素就消失了
   
push元素
arr.push('cat'),會把cat加到陣列的最後面

改變陣列裡面的元素
arr[1]=2000,會改變陣列index1的元素
arr[6]=5000,在陣列index6的位置加上元素
arr[arr.length-1]找到index6的元素

陣列切片
用arr.slice()
假如你要切陣列index3到6就打
arr.slice(3,6)
切片部會包含第6個元素 -->
