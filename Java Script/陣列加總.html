<!DOCTYPE html>

    <title>Java script賦值運算子</title>
    <!-- <link rel="stylesheet" href="style.css"> -->
</head>
<body>
    <h1>第一種迴圈for(1),用for迴圈到著數綿羊,直到睡著</h1>
    <script>
        var numbers = [1,3,4,5,6,7];
        var count = 0;
        numbers.forEach(function(num){
        count += num
   })
console.log(count);
    </script>

</body>
</html>
