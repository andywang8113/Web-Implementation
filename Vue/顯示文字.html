<!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <script src="https://unpkg.com/vue@3"></script>
        <style>
            #app{
                text-align: center;
                font-size: 50px;
                color:red;
            }
        </style>
    </head>
    <body>
        <div id="app">{{ message }}</div>
        <script>
            Vue.createApp({
              data(){
              return {
                 message: 'Hello,vue.js!'
               }
            }
    }).mount("#app");
        </script>
    </body>
    </html>


<!-- <div id="app">{{ message }}</div>
這行是vue.js裡面的Mustache的標籤樣板語法,
可以對應到vue應用程式中的同名資料
message: 'Hello,vue.js! -->
