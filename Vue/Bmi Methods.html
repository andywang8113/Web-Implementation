<!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <script src="https://unpkg.com/vue@3"></script>
    </head>
    <body>
        <div id="abc">
            <p>身高(cm):{{ height }}</p>
            <p>體重(kg):{{ weight }}</p>
            <p>BMI:{{ BMI() }}</p>
        </div>
        <script>
            Vue.createApp({
             data(){
              return{
                 height: 170,
                 weight: 50
            }
        },
            methods : {
             BMI(){
              return (this.weight / (this.height / 100)**2).toFixed(2)
            }
        }
    }).mount("#abc");
  </script>
    </body>
    </html>
