<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>個人資訊</title>
    <script src="https://unpkg.com/vue@3"></script>
</head>
<body>
    <div id="abc">
        <ul>
            <li v-for="(value, key) in obj" :key="key">
                {{ key }} : {{ value }}
            </li>
        </ul>
    </div>
    <script>
        Vue.createApp({
          data(){
            return{
              obj:{
               height:'169cm',
               weight:'45kg',
              birthday: '2003/12/30'
      }
    }
  }
}).mount("#abc");

    </script>
</body>
</html>
