<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>數字加總</title>
    <script src="https://unpkg.com/vue@3"></script>
</head>
<body>
    <div id="abc">
        <li v-for="item in arr">{{ item }}</li>
    </div>
    <script>
        Vue.createApp({
          data(){
            return{
              arr: ['DOG', 'bird', 'pig']
        }
    }
}).mount("#abc")
 </script>
</body>
</html>
