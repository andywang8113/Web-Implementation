<!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>公分轉英吋</title>
        <script src="https://unpkg.com/vue@3"></script>
    </head>
    <body>
        <div id="abc">
           <textarea rows="5" v-model="msg"></textarea>
           <P style="white-space: pre-line">輸入訊息如下:<br> {{ msg }}</P>
        </div>
        <script>
            Vue.createApp({
               data(){
                  return{
                      msg: ''
                }
            }
        }).mount("#abc")

        </script>
    </body>
    </html>
