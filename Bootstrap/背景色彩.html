<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Layout</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
    <div class="bg-primary text-white">bg-primary</div>
    <div class="bg-primary-subtle">bg-primary-subtle</div>
    <div class="bg-secondary text-white">bg-secondary</div>
    <div class="bg-secondary-subtle">bg-secondary-subtle</div>
    <div class="bg-success text-white">bg-success</div>
    <div class="bg-success-subtle">bg-success-subtle</div>
    <div class="bg-danger text-white">bg-danger</div>
    <div class="bg-danger-subtle">bg-danger-subtle</div>
    <div class="bg-warning text-white">bg-warning</div>
    <div class="bg-warning-subtle">bg-warning-subtle</div>
    <div class="bg-info text-white">bg-info</div>
    <div class="bg-info-subtle">bg-info-subtle</div>
    <div class="bg-light">bg-light</div>
    <div class="bg-light-subtle">bg-light-subtle</div>
    <div class="bg-dark text-white">bg-dark</div>
    <div class="bg-dark-subtle">bg-dark-subtle</div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
