<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Layout</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
    <img src="./圖片和影片/hs.jpg" width="32%" class="rounded">
    <img src="./圖片和影片/hs.jpg" width="32%" class="rounded-circle">
    <img src="./圖片和影片/hs.jpg" width="32%" class="rounded-pill">
    <img src="./圖片和影片/hs.jpg" width="32%" class="rounded-0">
    <img src="./圖片和影片/hs.jpg" width="32%" class="rounded-1">
    <img src="./圖片和影片/hs.jpg" width="32%" class="rounded-3">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>


<!-- rounded代表圓角
rounded-1數字越大圓角越大 -->
