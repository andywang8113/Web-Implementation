<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Layout</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <style>
        /* body{
            background-color: lightcyan;
        } */
    </style>
</head>
<body>
    <form>
        <div class="input-group my-3">
            <span class="input-group-text" id="abc">@</span>
            <input type="text" class="form-control" placeholder="輸入電子郵件帳號">
            <div id="comment1" class="form-text">*必填欄位</div>
        </div>
        <div class="input-group my-3">
            <span class="input-group-text" id="def">*</span>
            <input type="password" class="form-control" placeholder="請輸入密碼">
            <div id="comment2" class="form-text">*必填欄位</div>
        </div>
        <button class="btn btn-primary" type="submit">提交</button>
    </form>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
