<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Layout</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <style>
        /* body{
            background-color: lightcyan;
        } */
    </style>
</head>
<body>
    <form>
        <div class="form-check">
            <input class="form-check-input" type="checkbox" value="a1" id="a1">
            <label class="form-check-label" for="a1">小團員</label>
        </div>
        <div class="form-check">
            <input class="form-check-input" type="checkbox" value="a2" id="a2" checked>
            <label class="form-check-label" for="a2">大團員</label>
        </div>
        <div class="form-check">
            <input class="form-check-input" type="checkbox" value="a3" id="a3" disabled>
            <label class="form-check-label" for="a3">中團員</label>
        </div>
    </form>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
