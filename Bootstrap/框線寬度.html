<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Layout</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
    <div class="container my-3">
        <span class="border border-primary m-2" style="display: inline-block; width: 50px; height: 50px;"></span>
        <span class="border border-primary-subtle m-2" style="display: inline-block; width: 50px; height: 50px;"></span>
        <span class="border border-secondary m-2" style="display: inline-block; width: 50px; height: 50px;"></span>
        <span class="border border-secondary-subtle m-2" style="display: inline-block; width: 50px; height: 50px;"></span>
        <span class="border border-success m-2" style="display: inline-block; width: 50px; height: 50px;"></span>
        <span class="border border-success-subtle m-2" style="display: inline-block; width: 50px; height: 50px;"></span>
        <span class="border border-danger m-2" style="display: inline-block; width: 50px; height: 50px;"></span>
        <span class="border border-danger-subtle m-2" style="display: inline-block; width: 50px; height: 50px;"></span>
        <span class="border border-black m-2" style="display: inline-block; width: 50px; height: 50px;"></span>
        <span class="border border-warning m-2" style="display: inline-block; width: 50px; height: 50px;"></span>
        <span class="border border-warning-subtle m-2" style="display: inline-block; width: 50px; height: 50px;"></span>
        <span class="border border-info m-2" style="display: inline-block; width: 50px; height: 50px;"></span>
        <span class="border border-info-subtle m-2" style="display: inline-block; width: 50px; height: 50px;"></span>
        <span class="border border-light m-2" style="display: inline-block; width: 50px; height: 50px;"></span>
        <span class="border border-light-subtle m-2" style="display: inline-block; width: 50px; height: 50px;"></span>
        <span class="border border-dark m-2" style="display: inline-block; width: 50px; height: 50px;"></span>
        <span class="border border-dark-subtle m-2" style="display: inline-block; width: 50px; height: 50px;"></span>
        <span class="border border-white m-2" style="display: inline-block; width: 50px; height: 50px;"></span>
        <span class="border border-primary border-5 m-2" style="display: inline-block; width: 50px; height: 50px;"></span>
        <span class="border border-primary border-5 border-opacity-10 m-2" style="display: inline-block; width: 50px; height: 50px;"></span>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
