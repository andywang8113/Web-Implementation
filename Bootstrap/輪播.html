<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Layout</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <style>
        /* body{
            background-color: lightcyan;
        } */
         .container{
            text-align: left;
         }
         h5{
            color:red;
         }
    </style>
</head>
<body>
    <div id="abc" class="carousel slide" data-bs-ride="carousel">
        <div class="carousel-indicators">
            <button type="button" data-bs-target="#abc" data-bs-slide-to="0" class="active"></button>
            <button type="button" data-bs-target="#abc" data-bs-slide-to="1"></button>
            <button type="button" data-bs-target="#abc" data-bs-slide-to="2"></button>
        </div>
        <div class="carousel-inner">
            <div class="carousel-item active">
                <img src="./圖片和影片/hs.jpg" class="d-block w-100" alt="hs">
                <div class="carousel-caption">
                    <h5>現在購買MG HS,享91.9萬+2萬配件金</h5>
                </div> 
            </div>
            <div class="carousel-item">
                <img src="./圖片和影片/cx30.jpg" class="d-block w-100" alt="CX30">
                <div class="carousel-caption">
                    <h5>現在購買Mazda cx30,享93.8萬+2萬配件金</h5>
                </div> 
            </div>
            <div class="carousel-item">
                <img src="./圖片和影片/zs.jpg" class="d-block w-100" alt="zs">
                <div class="carousel-caption">
                    <h5>現在購買MG ZS,享74.9萬+2萬配件金</h5>
                </div> 
            </div>
        </div>
            <button class="carousel-control-prev" type="button" data-bs-target="#abc" data-bs-slide-to="prev">
                <span class="carousel-control-prev-icon"></span>
                <span class="visually-hidden">Previous</span>
            </button>
            <button class="carousel-control-next" type="button" data-bs-target="#abc" data-bs-slide-to="next">
                <span class="carousel-control-next-icon"></span>
                <span class="visually-hidden">Next</span>
            </button>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
